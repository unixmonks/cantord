# Copy to ~/.config/cantord/cantord.toml (or anywhere) and pass with
# `cantord -config /path/to/cantord.toml`. Any field left out uses the
# built-in default (see internal/config/config.go).

[server]
listen = "0.0.0.0:8080"

[library]
music_dirs = ["/home/you/Music"]
db_path = "~/.local/share/cantord/library.db"
art_cache_dir = "~/.local/share/cantord/art"

# How often to do a full rescan regardless of filesystem-notify activity.
# Useful when music_dirs is a network mount (NFS, etc): notify events don't
# see changes made by other clients, and won't necessarily fire when a mount
# comes back after being unreachable. A scan never deletes tracks on its own
# even if a mount is down — it only marks them unavailable — so this is safe
# to run often; see `cantordctl prune` to actually remove tracks confirmed gone.
rescan_interval = "15m"

[playback]
mpv_path = "mpv"
ipc_socket = "~/.local/share/cantord/mpv.sock"

# Optional. Force mpv's output driver/device for bit-perfect, exclusive-mode
# hi-res output instead of a mixed/resampled default:
#   ao = "alsa"                                   # Linux
#   audio_device = "alsa/hw:CARD=DAC,DEV=0"        # bypasses dmix resampling
#   ao = "oss"                                     # FreeBSD
#   audio_device = "oss//dev/dsp"

# Optional: the AI assistant (natural-language queue/playlist building).
# Leave this whole section out and cantord runs fine without it —
# GET /api/ai/status reports configured: false.
[ai]
provider = "anthropic"
model = "claude-opus-5"
# api_key left unset on purpose — set $CANTORD_AI_API_KEY instead so the key
# doesn't sit in a plaintext file. Uncomment only if you'd rather keep it here:
# api_key = "sk-ant-..."
